[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceqwa-mcp"
version = "0.1.0"
description = "Approval-driven MCP administration layer for the CEQWA static site"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=5.0", "PyMuPDF>=1.24"]

[project.scripts]
ceqwa-mcp = "ops.mcp_server:main"

[tool.setuptools.packages.find]
include = ["ops*"]
